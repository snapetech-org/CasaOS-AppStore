# ng-runner-policy: private-jit-only-v1
name: Release Store


run-name: >-
  ${{ inputs.release_tag != '' && format('action:{0}:pool:{1}:tag:{2}', inputs.action, inputs.runner_pool, inputs.release_tag) || format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [publish]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true
      release_tag:
        description: "Optional tag name to publish as the release version"
        required: false
        default: ""
      base_url:
        description: "Base URL used by the build action"
        required: false
        default: "https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages"
      purge_only:
        description: "Refresh jsDelivr paths from the latest gh-pages deployment without rebuilding"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private' &&
          inputs.release_tag != ''
        )
      ) &&
      (
        github.event_name != 'workflow_dispatch' || inputs.purge_only != true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-casaos-appstore","ng-main-run-{0}","gha-{0}-release"]}}', github.run_id)) }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_CACHE_KEY: build-appstore-cache-${{ inputs.release_tag }}-${{ github.run_id }}
      BUILD_CACHE_PREFIX: build-appstore-cache-${{ inputs.release_tag }}-
      BUILD_CACHE_MAIN_PREFIX: build-appstore-cache-main-
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Restore build caches
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/build_appstore/image-size-cache.json
            .cache/build_appstore/image-digest-cache.json
          key: ${{ env.BUILD_CACHE_KEY }}
          restore-keys: |
            ${{ env.BUILD_CACHE_PREFIX }}
            ${{ env.BUILD_CACHE_MAIN_PREFIX }}

      - name: Build static appstore dist
        id: build_v2
        continue-on-error: true
        uses: ./.github/actions/build-store-v2
        with:
          source: .
          output: dist
          base-url: ${{ inputs.base_url }}
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-v2-report.json
          report-title: Release V2 Store Report

      - name: Upload build report artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-v2-report
          path: |
            out/build-v2-report.json
          if-no-files-found: warn

      - name: Fail workflow if v2 build failed
        if: always() && steps.build_v2.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "V2 store build failed. See release-build-v2-report artifact."
          exit 1

      - name: Disable Jekyll
        run: |
          touch dist/.nojekyll

      - name: Write custom domain file
        run: |
          printf 'casaos.app\n' > dist/CNAME

      - name: Build legacy v1 appstore zip
        id: build_v1
        continue-on-error: true
        uses: ./.github/actions/build-store-v1
        with:
          source: .
          output-zip: dist/store/main.zip
          report-json: out/build-v1-report.json
          report-title: Release V1 Store Report

      - name: Upload v1 build report artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-v1-report
          path: |
            out/build-v1-report.json
            dist/store/main.zip
          if-no-files-found: warn

      - name: Fail workflow if v1 build failed
        if: always() && steps.build_v1.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "V1 store build failed. See release-build-v1-report artifact."
          exit 1

      - name: Create release bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          (cd dist && zip -r ../release-assets/v2-dist.zip .)
          cp dist/store/main.zip release-assets/main.zip
          cp out/build-v2-report.json release-assets/build-v2-report.json
          cp out/build-v1-report.json release-assets/build-v1-report.json

      - name: Upload release bundles artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-bundles
          path: release-assets

      - name: Save build caches
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/build_appstore/image-size-cache.json
            .cache/build_appstore/image-digest-cache.json
          key: ${{ env.BUILD_CACHE_KEY }}

      - name: Write release job summary
        if: always()
        uses: ./.github/actions/write-job-summary
        with:
          title: Release Summary
          report-jsons: |
            out/build-v2-report.json
            out/build-v1-report.json

      - name: Capture previous gh-pages revision
        id: gh_pages_before
        run: |
          set -euo pipefail
          previous="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          echo "sha=$previous" >> "$GITHUB_OUTPUT"

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Collect changed gh-pages paths
        env:
          PREVIOUS_GH_PAGES_SHA: ${{ steps.gh_pages_before.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin gh-pages --depth=2
          current="$(git rev-parse origin/gh-pages)"
          mkdir -p out
          paths_file="out/jsdelivr-purge-paths.txt"
          : > "$paths_file"

          if [[ -n "$PREVIOUS_GH_PAGES_SHA" ]] && git cat-file -e "$PREVIOUS_GH_PAGES_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$PREVIOUS_GH_PAGES_SHA" "$current" -- > "$paths_file"
          else
            git diff-tree --root --no-commit-id --name-only -r "$current" > "$paths_file"
          fi

          printf '%s\n' store.json index.json store/main.zip >> "$paths_file"
          sort -u -o "$paths_file" "$paths_file"
          echo "Collected $(wc -l < "$paths_file" | tr -d ' ') path(s) for jsDelivr purge"

      - name: Refresh jsDelivr cache
        continue-on-error: true
        run: |
          bash .github/scripts/purge-jsdelivr-cache.sh \
            --repository "${{ github.repository }}" \
            --ref gh-pages \
            --paths-file out/jsdelivr-purge-paths.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-assets/v2-dist.zip
            release-assets/main.zip
            release-assets/build-v2-report.json
            release-assets/build-v1-report.json

  purge-only:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        github.event_name == 'workflow_dispatch' && inputs.purge_only == true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-casaos-appstore","ng-main-run-{0}","gha-{0}-purge-only"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Collect latest gh-pages deployment paths
        run: |
          set -euo pipefail
          git fetch --no-tags origin gh-pages --depth=20
          latest="$(git log -1 --format='%H' --grep='^deploy:' origin/gh-pages || true)"
          latest="${latest:-$(git rev-parse origin/gh-pages)}"
          mkdir -p out
          paths_file="out/jsdelivr-purge-paths.txt"
          git diff-tree --root --no-commit-id --name-only -r "$latest" > "$paths_file"
          printf '%s\n' store.json index.json store/main.zip >> "$paths_file"
          sort -u -o "$paths_file" "$paths_file"
          echo "Using gh-pages deployment $latest"
          echo "Collected $(wc -l < "$paths_file" | tr -d ' ') path(s) for jsDelivr purge"

      - name: Refresh jsDelivr cache
        continue-on-error: true
        run: |
          bash .github/scripts/purge-jsdelivr-cache.sh \
            --repository "${{ github.repository }}" \
            --ref gh-pages \
            --paths-file out/jsdelivr-purge-paths.txt
