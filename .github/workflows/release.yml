# ng-runner-policy: private-jit-only-v1
name: Build Store Artifacts

on:
  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [publish]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true
      base_url:
        description: "Base URL used by the build action"
        required: false
        default: "https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages"

permissions:
  contents: read

jobs:
  build:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-casaos-appstore","ng-main-run-{0}","gha-{0}-build"]}}', github.run_id)) }}
    env:
      BUILD_CACHE_KEY: build-appstore-cache-${{ github.ref_name }}-${{ github.run_id }}
      BUILD_CACHE_PREFIX: build-appstore-cache-${{ github.ref_name }}-
      BUILD_CACHE_MAIN_PREFIX: build-appstore-cache-main-
    steps:
      - uses: actions/checkout@v6

      - name: Restore build caches
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/build_appstore/image-size-cache.json
            .cache/build_appstore/image-digest-cache.json
          key: ${{ env.BUILD_CACHE_KEY }}
          restore-keys: |
            ${{ env.BUILD_CACHE_PREFIX }}
            ${{ env.BUILD_CACHE_MAIN_PREFIX }}

      - name: Build static appstore dist
        id: build_v2
        continue-on-error: true
        uses: ./.github/actions/build-store-v2
        with:
          source: .
          output: dist
          base-url: ${{ inputs.base_url }}
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-v2-report.json
          report-title: Build V2 Store Report

      - name: Upload build report artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-v2-report
          path: |
            out/build-v2-report.json
          if-no-files-found: warn

      - name: Fail workflow if v2 build failed
        if: always() && steps.build_v2.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "V2 store build failed. See build-v2-report artifact."
          exit 1

      - name: Disable Jekyll
        run: |
          touch dist/.nojekyll

      - name: Build legacy v1 appstore zip
        id: build_v1
        continue-on-error: true
        uses: ./.github/actions/build-store-v1
        with:
          source: .
          output-zip: dist/store/main.zip
          report-json: out/build-v1-report.json
          report-title: Build V1 Store Report

      - name: Upload v1 build report artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-v1-report
          path: |
            out/build-v1-report.json
            dist/store/main.zip
          if-no-files-found: warn

      - name: Fail workflow if v1 build failed
        if: always() && steps.build_v1.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "V1 store build failed. See build-v1-report artifact."
          exit 1

      - name: Upload store deliverables
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: store-deliverables
          path: |
            dist
            dist/store/main.zip
          if-no-files-found: warn

      - name: Save build caches
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/build_appstore/image-size-cache.json
            .cache/build_appstore/image-digest-cache.json
          key: ${{ env.BUILD_CACHE_KEY }}

      - name: Write build job summary
        if: always()
        uses: ./.github/actions/write-job-summary
        with:
          title: Build Summary
          report-jsons: |
            out/build-v2-report.json
            out/build-v1-report.json
